<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
    <link rel="stylesheet" href="/styles/main.css">
    <title>Contáctanos</title>
</head>

<body>
<h2 class="titulo">Contáctanos</h2>
<section class="container">
    <div class="row">
        <div class="col-6 datosContacto">
            <h3>Datos de Contacto</h3>
            <h5>E-mail: genclothes@gmail.com</h5>
            <h5>Teléfono: 3202134567</h5>
            <h5>Ubicación: La Candelaria, Bogotá, Colombia</h5>
            <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d...etc"
            width="600" 
            height="450" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
</iframe>
        </div>
        
        <div class="col-6">
            <h3>¿Necesitas Ayuda?</h3>
            <div class="row">
                <form action="procesar_formulario">
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" id="nombre" aria-describedby="nombreHelp" placeholder="Tu Nombre">
                    <div id="emailHelp" class="form-text">Ingresa tu nombre completo</div>
                </div>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                    <div id="emailHelp" class="form-text">tucorreo@ejemplo.com</div>
                </div>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Teléfono</label>
                    <input type="text" class="form-control" id="nombre" aria-describedby="nombreHelp" placeholder="Tu Teléfono">
                    <div id="emailHelp" class="form-text">Ingresa tu número telefónico</div>
                </div>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Mensaje</label>
                    <input type="text" class="form-control" id="nombre" aria-describedby="nombreHelp" placeholder="Ingresa tu mensaje">
                    <div id="emailHelp" class="form-text">Déjanos tu mensaje</div>
                </div>                

                <button type="submit" class="btn btn-primary btn-add-primary">Enviar</button>
</body>
    
</html>
